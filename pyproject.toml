[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snug"
version = "0.1.0"
description = "A cross-platform system-tray application for monitoring, displaying and logging thermal and hardware data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
snug = "snug.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snug*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
